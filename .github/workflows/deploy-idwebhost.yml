# Deploy website muasolo.com ke hosting IDwebhost (cPanel).
# Firewall hosting membatasi banyak koneksi FTP, jadi seluruh situs dikirim sebagai SATU zip
# lalu dibongkar di server oleh unpack.php (token acak sekali pakai) lewat HTTPS.
# Butuh GitHub Secrets: FTP_SERVER, FTP_USERNAME, FTP_PASSWORD, FTP_DIR,
# ADMIN_KEY, ANTHROPIC_API_KEY, IG_ACCESS_TOKEN (opsional: NOTIFY_EMAIL, FTP_PROTOCOL).
name: Deploy ke IDwebhost

on:
  push:
    branches: [main, claude/serene-archimedes-ywas6w]
    paths: ["website/**", ".github/workflows/deploy-idwebhost.yml"]
  workflow_dispatch:

concurrency:
  group: deploy-idwebhost
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
    steps:
      - name: Lewati jika data FTP belum diisi
        if: env.FTP_SERVER == ''
        run: echo "::notice::Secrets FTP belum diisi, deploy dilewati."

      - uses: actions/checkout@v4
        if: env.FTP_SERVER != ''

      - uses: shivammathur/setup-php@v2
        if: env.FTP_SERVER != ''
        with:
          php-version: "8.1"
          tools: composer

      - name: Rakit paket website
        if: env.FTP_SERVER != ''
        run: bash website/server/build-host.sh

      - name: Tulis kunci rahasia (tidak ikut ke repo)
        if: env.FTP_SERVER != ''
        env:
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
        run: |
          php -r '$k=["ADMIN_KEY","ANTHROPIC_API_KEY","IG_ACCESS_TOKEN","NOTIFY_EMAIL"]; $o=[]; foreach($k as $x){$o[$x]=(string)getenv($x);} file_put_contents("website/dist-host/api/secrets.php", "<?php\nreturn ".var_export($o,true).";\n");'

      - name: Bungkus situs jadi satu zip + siapkan pembongkar
        if: env.FTP_SERVER != ''
        run: |
          cd website/dist-host
          zip -q -r -0 ../../site.zip . -x 'm/.keep'
          cd ../..
          TOKEN=$(openssl rand -hex 24)
          echo "::add-mask::$TOKEN"
          echo "DEPLOY_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          sed "s/__DEPLOY_TOKEN__/$TOKEN/" website/server/unpack.php > unpack.php
          ls -la site.zip unpack.php

      - name: Upload 2 file lewat FTP
        if: env.FTP_SERVER != ''
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ secrets.FTP_DIR }}
          FTP_PROTOCOL: ${{ secrets.FTP_PROTOCOL }}
        run: |
          # curl sudah tersedia di runner (tanpa apt). FTP dengan TLS wajib (sertifikat diverifikasi),
          # kecuali secret FTP_PROTOCOL diisi "ftp".
          TLS="--ssl-reqd"; [ "$FTP_PROTOCOL" = "ftp" ] && TLS=""
          DIR="${FTP_DIR#./}"; DIR="${DIR#/}"
          # Sertifikat FTP hosting bersama memakai nama server (bukan nama domain kita):
          # ambil nama di sertifikat, lalu sambungkan nama itu ke server yang sama agar verifikasi tetap jalan.
          HOST="$FTP_SERVER"
          if [ -n "$TLS" ]; then
            CN=$(echo | openssl s_client -starttls ftp -connect "$FTP_SERVER:21" 2>/dev/null \
                 | openssl x509 -noout -subject -nameopt multiline 2>/dev/null | awk -F' = ' '/commonName/{print $2; exit}')
            echo "Nama di sertifikat FTP: ${CN:-tidak terbaca}"
            CN="${CN/#\*./deploy.}"   # sertifikat wildcard (*.contoh.com) -> deploy.contoh.com
            [ -n "$CN" ] && HOST="$CN"
          fi
          for f in site.zip unpack.php; do
            curl -sS $TLS --ftp-pasv --retry 4 --retry-delay 10 --connect-timeout 30 \
              --connect-to "$HOST:21:$FTP_SERVER:21" \
              --user "$FTP_USERNAME:$FTP_PASSWORD" -T "$f" "ftp://$HOST/$DIR"
            echo "terkirim: $f"
          done

      - name: Bongkar di server
        if: env.FTP_SERVER != ''
        run: |
          IP=$(getent hosts "$FTP_SERVER" | awk '{print $1; exit}')
          echo "Server hosting: $IP"
          # Sebelum DNS dipindah, muasolo.com diarahkan langsung ke IP hosting; sertifikat bisa belum terbit (-k).
          OUT=$(curl -sS -k -L --fail-with-body --max-time 600 --resolve "muasolo.com:443:$IP" --resolve "muasolo.com:80:$IP" \
            "https://muasolo.com/unpack.php?t=$DEPLOY_TOKEN" \
          || curl -sS -k -L --fail-with-body --max-time 600 --resolve "muasolo.com:443:$IP" --resolve "muasolo.com:80:$IP" \
            "http://muasolo.com/unpack.php?t=$DEPLOY_TOKEN") || { echo "$OUT"; exit 1; }
          echo "$OUT"
          PHPV=$(echo "$OUT" | grep -o '"php":"[0-9.]*"' | head -1 | grep -o '[0-9][0-9.]*')
          if [ -n "$PHPV" ] && [ "$(printf '%s\n8.1\n' "$PHPV" | sort -V | head -1)" != "8.1" ]; then
            echo "::error::muasolo.com memakai PHP $PHPV. Buka cPanel > MultiPHP Manager, pilih muasolo.com, set PHP 8.2/8.3, Apply."
            exit 1
          fi
          curl -sS -k -o /dev/null -w "Cek halaman utama: HTTP %{http_code}\n" --resolve "muasolo.com:443:$IP" https://muasolo.com/

      - name: Cek server PHP (form, admin, CRM)
        if: env.FTP_SERVER != ''
        run: |
          IP=$(getent hosts "$FTP_SERVER" | awk '{print $1; exit}')
          check() { # url, kode HTTP yang diharapkan
            code=$(curl -sS -k -o body.txt -w "%{http_code}" --resolve "muasolo.com:443:$IP" "https://muasolo.com$1")
            echo "$1 -> HTTP $code: $(head -c 150 body.txt)"
            [ "$code" = "$2" ] || { echo "::error::$1 seharusnya HTTP $2 (versi PHP hosting minimal 8.1?)"; FAIL=1; }
          }
          FAIL=0
          check /api/form.php 405
          check /api/ig/status 401
          check /api/crm/meta 401
          check /api/secrets.php 403
          check /data/.htaccess 403
          exit $FAIL
