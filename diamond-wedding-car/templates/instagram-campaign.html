<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>DIAMOND WEDDING CAR — Campaign Instagram 1080×1350</title>
<link rel="stylesheet" href="../assets/brand.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #333; }
  .post {
    width: 1080px; height: 1350px; position: relative; overflow: hidden;
    background: radial-gradient(120% 80% at 50% 0%, #17503f 0%, var(--emerald) 45%, var(--emerald-deep) 100%);
    color: var(--ivory); font-family: var(--f-sans);
    display: flex; flex-direction: column; align-items: center; text-align: center;
    padding: 84px 90px 72px;
  }
  .frame { position: absolute; inset: 34px; border: 2px solid var(--champagne); pointer-events: none; }
  .frame::after { content: ''; position: absolute; inset: 10px; border: 1px solid rgba(198,161,91,.5); }
  .logo { width: 330px; }
  .eyebrow { margin-top: 54px; font-size: 22px; letter-spacing: .42em; color: var(--champagne); font-weight: 500; }
  h1 { font-family: var(--f-display); font-weight: 500; font-size: 84px; line-height: 1.08; letter-spacing: .04em; margin-top: 22px; }
  h1 em { font-family: var(--f-serif); font-style: italic; font-weight: 500; color: var(--champagne-light); letter-spacing: 0; font-size: 1.12em; }
  .rule { display: flex; align-items: center; gap: 16px; margin: 36px 0 30px; color: var(--champagne); }
  .rule i { width: 150px; height: 1px; background: currentColor; }
  .rule b { width: 10px; height: 10px; background: currentColor; transform: rotate(45deg); }
  .car { font-family: var(--f-serif); font-size: 46px; font-weight: 500; }
  .list { list-style: none; margin-top: 30px; display: inline-grid; text-align: left; gap: 16px; font-size: 27px; font-weight: 300; letter-spacing: .02em; }
  .list li::before { content: '◆'; color: var(--champagne); font-size: 16px; margin-right: 16px; vertical-align: 4px; }
  .offers { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; width: 100%; margin-top: 52px; }
  .offer { border: 1.5px solid var(--champagne); padding: 24px 18px 22px; background: rgba(10,38,31,.55); }
  .offer small { display: block; font-size: 17px; letter-spacing: .3em; color: var(--champagne); }
  .offer strong { display: block; font-family: var(--f-sans); font-weight: 400; font-size: 50px; line-height: 1.15; letter-spacing: .01em; margin-top: 10px; color: var(--ivory); }
  .offer span { display: block; font-size: 18px; margin-top: 6px; opacity: .85; }
  .foot { margin-top: auto; margin-bottom: 4px; font-family: var(--f-serif); font-style: italic; font-size: 38px; color: var(--champagne-light); }
  .handle { margin-top: 12px; font-size: 19px; letter-spacing: .32em; color: var(--champagne); }
</style>
</head>
<body>
<div class="post" id="post">
  <div class="frame"></div>
  <img class="logo" src="../logo/diamond-logo-horizontal-reverse.svg" alt="DIAMOND WEDDING CAR" style="width:440px">
  <p class="eyebrow">BRAND CAMPAIGN</p>
  <h1>YOUR WEDDING,<br>YOUR <em>Diamond</em> MOMENT</h1>
  <div class="rule"><i></i><b></b><i></i></div>
  <p class="car">Toyota Alphard Putih</p>
  <ul class="list">
    <li>Driver profesional</li>
    <li>BBM termasuk</li>
    <li>Dekorasi bunga pengantin</li>
  </ul>
  <div class="offers">
    <div class="offer"><small>CASHBACK</small><strong>Rp500.000</strong><span>untuk setiap pemesanan</span></div>
    <div class="offer"><small>VOUCHER</small><strong>Rp1.500.000</strong><span>Diamond Makeup Artist</span></div>
  </div>
  <p class="foot">Make your special day unforgettable.</p>
  <p class="handle">@DIAMOND.WEDDINGCAR</p>
</div>
</body>
</html>
