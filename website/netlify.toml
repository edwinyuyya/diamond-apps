[build]
  # Halaman statis disalin ke dist supaya kode server & node_modules tidak ikut terbit
  command = "rm -rf dist && mkdir dist && cp -r index.html admin media favicon.svg favicon-48.png apple-touch-icon.png og-image.jpg robots.txt sitemap.xml dist/"
  publish = "dist"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Domain tambahan diarahkan permanen (301) ke domain utama muasolo.com
[[redirects]]
  from = "https://muasolo.site/*"
  to = "https://muasolo.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.muasolo.site/*"
  to = "https://muasolo.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://muasolo.it.com/*"
  to = "https://muasolo.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.muasolo.it.com/*"
  to = "https://muasolo.com/:splat"
  status = 301
  force = true
